<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 ClayMix — Смешивание полимерной глины</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ec;
    --warm: #f5e6c8;
    --caramel: #c9924a;
    --chocolate: #6b3a1f;
    --milk: #fefaf3;
    --clay-shadow: rgba(107,58,31,0.13);
    --accent: #d4733a;
    --soft: #e8d5b0;
    --glass: rgba(255,251,245,0.82);
    --tag-bg: #f7ede0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(212,115,58,0.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(201,146,74,0.1) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9924a' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  header {
    background: linear-gradient(135deg, var(--chocolate) 0%, #8b4f28 60%, var(--caramel) 100%);
    padding: 28px 40px 22px;
    display: flex; align-items: center; gap: 18px;
    box-shadow: 0 4px 24px rgba(107,58,31,0.22);
    position: relative; overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    border-radius: 50%;
  }
  .header-icon { font-size: 2.4rem; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3)); }
  .header-text h1 {
    font-family: 'Playfair Display', serif;
    color: #fff; font-size: 1.85rem; font-weight: 700;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .header-text p { color: rgba(255,255,255,0.75); font-size: 0.88rem; font-weight: 300; margin-top: 3px; }

  .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }

  .section-title {
    font-family: 'Playfair Display', serif;
    color: var(--chocolate); font-size: 1.25rem; font-weight: 600;
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(to right, var(--caramel), transparent);
  }

  /* КАТЕГОРИИ */
  .categories {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px;
  }
  .cat-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 18px; border-radius: 50px; border: 2px solid transparent;
    cursor: pointer; font-family: 'Nunito', sans-serif; font-size: 0.88rem; font-weight: 600;
    background: white; color: var(--chocolate);
    box-shadow: 0 2px 8px var(--clay-shadow);
    transition: all 0.2s ease;
  }
  .cat-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px var(--clay-shadow); }
  .cat-btn.active {
    background: linear-gradient(135deg, var(--chocolate), var(--caramel));
    color: white; border-color: transparent;
    box-shadow: 0 4px 16px rgba(107,58,31,0.3);
  }
  .cat-btn .cat-icon { font-size: 1.1rem; }

  /* СЕТКА РЕЦЕПТОВ */
  .recipes-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 22px;
  }

  .recipe-card {
    background: var(--glass);
    border-radius: 20px;
    box-shadow: 0 4px 24px var(--clay-shadow);
    overflow: hidden;
    border: 1px solid rgba(201,146,74,0.18);
    backdrop-filter: blur(8px);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    cursor: pointer;
  }
  .recipe-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 40px rgba(107,58,31,0.18);
  }

  .card-header {
    padding: 18px 20px 14px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid rgba(201,146,74,0.15);
  }
  .color-preview {
    width: 52px; height: 52px; border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    flex-shrink: 0; position: relative; overflow: hidden;
  }
  .color-preview::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%);
  }
  .card-title-block { flex: 1; min-width: 0; }
  .card-title {
    font-family: 'Playfair Display', serif;
    color: var(--chocolate); font-size: 1.05rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-subtitle { color: #a0835c; font-size: 0.78rem; margin-top: 3px; }
  .category-tag {
    font-size: 0.72rem; font-weight: 600; padding: 3px 9px;
    border-radius: 20px; background: var(--tag-bg); color: var(--caramel);
    border: 1px solid rgba(201,146,74,0.25); white-space: nowrap;
  }

  .card-body { padding: 16px 20px 18px; }

  .ingredients-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .ingredient-row {
    display: flex; align-items: center; gap: 10px;
  }
  .ing-swatch {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    position: relative; overflow: hidden;
  }
  .ing-swatch.translucent {
    background-image:
      linear-gradient(45deg, #ddd 25%, transparent 25%),
      linear-gradient(-45deg, #ddd 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ddd 75%),
      linear-gradient(-45deg, transparent 75%, #ddd 75%) !important;
    background-size: 8px 8px;
    background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
    background-color: #f0f0f0;
    position: relative;
  }
  .ing-swatch.translucent .swatch-color {
    position: absolute; inset: 0; border-radius: 8px;
  }
  .ing-swatch.translucent::after {
    content: '◈';
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: rgba(255,255,255,0.85); font-size: 0.75rem; text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    z-index: 2;
  }
  .ing-info { flex: 1; min-width: 0; }
  .ing-name { font-size: 0.82rem; font-weight: 600; color: var(--chocolate); }
  .ing-code { font-size: 0.73rem; color: #a0835c; }
  .ing-ratio {
    font-size: 0.78rem; font-weight: 700; color: var(--accent);
    background: rgba(212,115,58,0.1); padding: 2px 8px; border-radius: 10px;
    white-space: nowrap; flex-shrink: 0;
  }

  .tip-box {
    background: linear-gradient(135deg, rgba(201,146,74,0.08), rgba(212,115,58,0.06));
    border-left: 3px solid var(--caramel);
    border-radius: 0 10px 10px 0;
    padding: 10px 13px;
    font-size: 0.79rem; color: #7a5c3a; line-height: 1.55;
    margin-bottom: 14px;
  }
  .tip-box strong { color: var(--chocolate); }

  .shop-links { display: flex; flex-direction: column; gap: 6px; }
  .shop-link-label {
    font-size: 0.73rem; font-weight: 700; color: var(--caramel);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .shop-btn {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; border-radius: 10px;
    text-decoration: none; font-size: 0.78rem; font-weight: 600;
    transition: all 0.18s ease;
    border: 1.5px solid transparent;
  }
  .shop-btn:hover { transform: translateX(3px); }
  .shop-btn .shop-name { display: flex; align-items: center; gap: 6px; }
  .shop-btn .shop-arrow { font-size: 0.9rem; opacity: 0.7; }
  .shop-ozon { background: rgba(0,91,255,0.06); color: #005BFF; border-color: rgba(0,91,255,0.15); }
  .shop-ozon:hover { background: rgba(0,91,255,0.12); border-color: rgba(0,91,255,0.3); }
  .shop-wb { background: rgba(148,0,211,0.06); color: #9400D3; border-color: rgba(148,0,211,0.15); }
  .shop-wb:hover { background: rgba(148,0,211,0.12); border-color: rgba(148,0,211,0.3); }

  /* Переключатель марки — глобальный */
  .brand-switcher {
    display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
  }
  .brand-switcher-label {
    font-size: 0.78rem; font-weight: 700; color: var(--caramel);
    text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
  }
  .brand-btn {
    padding: 6px 15px; border-radius: 20px; border: 2px solid rgba(201,146,74,0.25);
    background: white; font-family: 'Nunito', sans-serif;
    font-size: 0.8rem; font-weight: 700; color: var(--caramel);
    cursor: pointer; transition: all 0.18s; white-space: nowrap;
  }
  .brand-btn:hover { border-color: var(--caramel); }
  .brand-btn.active {
    background: var(--accent); color: white; border-color: var(--accent);
    box-shadow: 0 3px 10px rgba(212,115,58,0.35);
  }
  .brand-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--warm); border-radius: 16px;
    padding: 10px 16px; margin-bottom: 20px;
  }
  .brand-note {
    font-size: 0.73rem; color: #a0835c; font-style: italic; width: 100%;
    margin-top: 2px; display: none;
  }
  .brand-note.visible { display: block; }
  .search-bar {
    display: flex; gap: 12px; margin-bottom: 22px; align-items: center;
  }
  .search-input {
    flex: 1; padding: 11px 18px; border-radius: 50px;
    border: 2px solid rgba(201,146,74,0.25);
    background: white; font-family: 'Nunito', sans-serif; font-size: 0.9rem;
    color: var(--chocolate); outline: none;
    box-shadow: 0 2px 10px var(--clay-shadow);
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--caramel); }
  .search-input::placeholder { color: #c9b090; }

  .count-badge {
    background: var(--warm); color: var(--chocolate);
    padding: 7px 16px; border-radius: 50px; font-size: 0.82rem; font-weight: 700;
    box-shadow: 0 2px 8px var(--clay-shadow); white-space: nowrap;
  }

  /* Пустое */
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--caramel);
    grid-column: 1/-1;
  }
  .empty-state .empty-icon { font-size: 3rem; margin-bottom: 14px; }
  .empty-state p { font-size: 0.95rem; color: #a0835c; }

  @media (max-width: 600px) {
    header { padding: 20px; }
    .header-text h1 { font-size: 1.4rem; }
    .container { padding: 20px 12px 50px; }
    .recipes-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>

  <div class="recipes-grid" id="recipesGrid"></div>

</div>

let currentCategory = 'all';
let currentSearch = '';
let currentBrand = 'Cernit N°1';

function setCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRecipes();
}

function switchBrand(brandKey, btn) {
  currentBrand = brandKey;
  document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRecipes();
}

function filterRecipes() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase();
  renderRecipes();
}

function getFiltered() {
  return RECIPES.filter(r => {
    const matchCat = currentCategory === 'all' || r.cat === currentCategory;
    const searchTerms = currentSearch.trim().split(/\s+/).filter(Boolean);
    const matchSearch = searchTerms.length === 0 || searchTerms.every(term =>
      r.name.toLowerCase().includes(term) ||
      r.subtitle.toLowerCase().includes(term) ||
      r.desc.toLowerCase().includes(term) ||
      (r.tags || []).some(t => t.includes(term)) ||
      r.ingredients.some(i => i.name.toLowerCase().includes(term) || i.brand.toLowerCase().includes(term))
    );
    return matchCat && matchSearch;
  });
}

function renderRecipes() {
  const filtered = getFiltered();
  const grid = document.getElementById('recipesGrid');
  document.getElementById('countBadge').textContent = `${filtered.length} рецепт${filtered.length === 1 ? '' : filtered.length < 5 ? 'а' : 'ов'}`;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><p>Ничего не найдено. Попробуйте другой запрос.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const ings = currentBrand ? convertRecipe(r.ingredients, currentBrand) : r.ingredients;

    const ingsHtml = ings.map(ing => `
      <div class="ingredient-row">
        <div class="ing-swatch ${ing.translucent ? 'translucent' : ''}" style="${ing.translucent ? '' : 'background:'+ing.color}">
          ${ing.translucent ? `<div class="swatch-color" style="background:${ing.color};opacity:0.7;"></div>` : ''}
        </div>
        <div class="ing-info">
          <div class="ing-name">${ing.name}</div>
          <div class="ing-code">${ing.brand} · №${ing.code}</div>
        </div>
        <div class="ing-ratio">${ing.ratio}</div>
      </div>
    `).join('');

    const shopsHtml = ings.map(ing => `
      <div style="margin-bottom:8px;">
        <div style="font-size:0.73rem;font-weight:700;color:#6b3a1f;margin-bottom:4px;padding-left:2px;">${ing.brand} №${ing.code} — ${ing.name}</div>
        <a href="${ing.ozon}" target="_blank" class="shop-btn shop-ozon">
          <span class="shop-name">🔵 Ozon</span><span class="shop-arrow">→</span>
        </a>
        <a href="${ing.wb}" target="_blank" class="shop-btn shop-wb" style="margin-top:4px;">
          <span class="shop-name">🟣 Wildberries</span><span class="shop-arrow">→</span>
        </a>
      </div>
    `).join('');

    return `
      <div class="recipe-card">
        <div class="card-header">
          <div class="color-preview" style="background:${r.color}"></div>
          <div class="card-title-block">
            <div class="card-title">${r.name}</div>
            <div class="card-subtitle">${r.subtitle}</div>
          </div>
          <span class="category-tag">${getCatLabel(r.cat)}</span>

// Вычислить дистанцию между двумя hex-цветами в пространстве RGB
function colorDist(hex1, hex2) {
  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const [r1,g1,b1] = p(hex1); const [r2,g2,b2] = p(hex2);
  return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
}

// Карта: основная марка → прозрачная серия
const TRANSLUCENT_BRAND_MAP = {
  "Cernit N°1":       "Cernit Translucent",
  "Cernit Translucent": "Cernit Translucent",
  "Fimo Soft":        "Fimo Effect",
  "Fimo Effect":      "Fimo Effect",
  "Artifact Classic": "Artifact Chiffon",
  "Artifact Chiffon": "Artifact Chiffon"
};

// Найти ближайший цвет в палитре марки (с учётом прозрачности)
function findNearest(targetColor, brandKey, preferTranslucent) {
  // Если исходный прозрачный — ищем в прозрачной серии этой марки
  if (preferTranslucent) {
    const transKey = TRANSLUCENT_BRAND_MAP[brandKey] || brandKey;
    const transPalette = (BRAND_PALETTES[transKey] || []).filter(e => e.translucent);
    if (transPalette.length) {
      let best = transPalette[0], bestDist = Infinity;
      for (const entry of transPalette) {
        const d = colorDist(targetColor, entry.color);
        if (d < bestDist) { bestDist = d; best = entry; }
      }
      // Возвращаем с правильным brand key (прозрачная серия)
      return { ...best, _brandKey: transKey };
    }
  }
  
  // Обычный поиск среди всех цветов марки
  const palette = BRAND_PALETTES[brandKey] || [];
  if (!palette.length) return null;
  let best = palette[0], bestDist = Infinity;
  for (const entry of palette) {
    const d = colorDist(targetColor, entry.color);
    if (d < bestDist) { bestDist = d; best = entry; }
  }
  return { ...best, _brandKey: brandKey };
}

// Конвертировать рецепт под выбранную марку
function convertRecipe(ingredients, brandKey) {
  // Маппируем каждый ингредиент на ближайший в целевой марке
  const mapped = ingredients.map(ing => {
    const nearest = findNearest(ing.color, brandKey, !!ing.translucent);
    if (!nearest) return ing;
    const actualBrand = nearest._brandKey || brandKey;
    return {
      ...ing,
      brand: actualBrand,
      code: nearest.code,
      name: nearest.name,
      color: nearest.color,
      translucent: !!nearest.translucent,
      ozon: `https://www.ozon.ru/search/?text=${encodeURIComponent(actualBrand.toLowerCase()+' '+nearest.code+' '+nearest.name)}`,
      wb: `https://www.wildberries.ru/catalog/0/search.aspx?search=${encodeURIComponent(actualBrand.toLowerCase()+' '+nearest.code+' '+nearest.name)}`
    };
  });

  // Объединяем дубликаты (одинаковый code), суммируя пропорции
  const merged = [];
  for (const ing of mapped) {
    const existing = merged.find(x => x.code === ing.code && x.brand === ing.brand);
    if (existing) {
      const sum = parseFloat(existing.ratio) + parseFloat(ing.ratio);
      // Округляем до 1 знака, убираем .0 если целое
      const rounded = Math.round(sum * 10) / 10;
      existing.ratio = (rounded % 1 === 0 ? rounded.toFixed(0) : rounded.toFixed(1)) + ' ' + (ing.ratio.includes('часть') ? (rounded === 1 ? 'часть' : 'части') : '');
      // Нормализуем суффикс
      const num = rounded;
      if (num === 1) existing.ratio = '1 часть';
      else if (num < 5) existing.ratio = rounded.toFixed(num % 1 === 0 ? 0 : 1) + ' части';
      else existing.ratio = rounded.toFixed(num % 1 === 0 ? 0 : 1) + ' частей';
    } else {
      merged.push({ ...ing });
    }
  }
  return merged;
}
